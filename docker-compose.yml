services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vandi
      POSTGRES_PASSWORD: vandi
      POSTGRES_DB: vandiottunar
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vandi -d vandiottunar"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://vandi:vandi@db:5432/vandiottunar
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
